<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<title>Exercícios String</title>
</head>
<body>

	<h3>1. Padronização de nome</h3>
	<input type="text" id="input1" placeholder="Digite uma string de teste">
	<button id="btn1">Executar</button>
	<p id="resultado1"></p>

	<h3>2. Verificação de domínio de e-mail</h3>
	<input type="text" id="input2" placeholder="Digite um email teste">
	<button id="btn2">Executar</button>
	<p id="resultado2"></p>

	<h3>3. Contagem de caracteres</h3>
	<input type="text" id="input3" placeholder="Digite uma frase teste">
	<button id="btn3">Executar</button>
	<p id="resultado3"></p>

	<h3>4. Busca de palavra</h3>
	<textarea id="input4" placeholder="Digite uma frase teste"></textarea>
	<button id="btn4">Executar</button>
	<p id="resultado4"></p>

	<h3>5. Extração de nome de usuário</h3>
	<input type="text" id="input5" placeholder="Digite um email teste">
	<button id="btn5">Executar</button>
	<p id="resultado5"></p>

	<h3>6. Substituição de informações</h3>
	<textarea id="input6" placeholder="Digite uma frase teste"></textarea>
	<button id="btn6">Executar</button>
	<p id="resultado6"></p>

	<h3>7. Formatação de código de produto</h3>
	<input type="text" id="input7" placeholder="Digite um código de teste">
	<button id="btn7">Executar</button>
	<p id="resultado7"></p>

	<h3>8. Inversão de uma string</h3>
	<textarea id="input8" placeholder="Digite uma frase teste"></textarea>
	<button id="btn8">Executar</button>
	<p id="resultado8"></p>

	<h3>9. Análise de uma senha</h3>
	<input type="text" id="input9" placeholder="Digite uma senha teste">
	<button id="btn9">Executar</button>
	<p id="resultado9"></p>

	<h3>10. Formatação de nome completo</h3>
	<input type="text" id="input10" placeholder="Digite um nome teste">
	<button id="btn10">Executar</button>
	<p id="resultado10"></p>

	<script>
			// 1
			document.getElementById("btn1").addEventListener("click", () => {
			  let texto = document.getElementById("input1").value;
			  document.getElementById("resultado1").innerText = texto.trim().toLowerCase();
			});

			// 2
			document.getElementById("btn2").addEventListener("click", () => {
			  let email = document.getElementById("input2").value;
			  if (email.endsWith("@exemplo.com")) {
				document.getElementById("resultado2").innerText = "E-mail válido";
			  } else {
				document.getElementById("resultado2").innerText = "E-mail inválido";
			  }
			});

			// 3
			document.getElementById("btn3").addEventListener("click", () => {
			  let frase = document.getElementById("input3").value;
			  let semEspacos = frase.replaceAll(" ", "");
			  document.getElementById("resultado3").innerText =
				"Total: " + frase.length + " | Sem espaços: " + semEspacos.length;
			});

			// 4
			document.getElementById("btn4").addEventListener("click", () => {
			  let mensagem = document.getElementById("input4").value;
			  if (mensagem.includes("JavaScript")) {
				document.getElementById("resultado4").innerText = "A mensagem contém JavaScript.";
			  } else {
				document.getElementById("resultado4").innerText = "A mensagem não contém JavaScript.";
			  }
			});

			// 5
			document.getElementById("btn5").addEventListener("click", () => {
			  let email = document.getElementById("input5").value;
			  let posicao = email.indexOf("@");
			  document.getElementById("resultado5").innerText = email.slice(0, posicao);
			});

			// 6
			document.getElementById("btn6").addEventListener("click", () => {
			  let mensagem = document.getElementById("input6").value;
			  document.getElementById("resultado6").innerText = mensagem.replaceAll("João", "Maria");
			});

			// 7
			document.getElementById("btn7").addEventListener("click", () => {
			  let codigo = document.getElementById("input7").value.toUpperCase();
			  document.getElementById("resultado7").innerText = codigo.slice(0, 3) + "-" + codigo.slice(3);
			});

			// 8
			function inverterString(texto) {
			  return texto.split("").reverse().join("");
			}

			document.getElementById("btn8").addEventListener("click", () => {
			  let texto = document.getElementById("input8").value;
			  document.getElementById("resultado8").innerText = inverterString(texto);
			});

			// 9
			function validarSenha(senha) {
			  let tamanhoOk = senha.length >= 8;
			  let temMaiuscula = senha !== senha.toLowerCase();
			  let temMinuscula = senha !== senha.toUpperCase();
			  let temNumero = "0123456789".split("").some(n => senha.includes(n));
			  return tamanhoOk && temMaiuscula && temMinuscula && temNumero;
			}

			document.getElementById("btn9").addEventListener("click", () => {
			  let senha = document.getElementById("input9").value;
			  document.getElementById("resultado9").innerText = validarSenha(senha);
			});

			// 10
			function formatarNome(nome) {
			  return nome
				.trim()
				.toLowerCase()
				.split(" ")
				.filter(palavra => palavra !== "")
				.map(palavra => palavra[0].toUpperCase() + palavra.slice(1))
				.join(" ");
			}

			document.getElementById("btn10").addEventListener("click", () => {
			  let nome = document.getElementById("input10").value;
			  document.getElementById("resultado10").innerText = formatarNome(nome);
			});
	</script>

</body>
</html>
